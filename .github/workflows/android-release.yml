name: Android release gate

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Kotlin compiler
        run: |
          curl -sSL -o /tmp/kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.3.21/kotlin-compiler-2.3.21.zip
          unzip -q /tmp/kotlinc.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Source, market and JVM gates
        run: |
          python3 scripts/source_audit.py
          python3 scripts/market_release_gate.py
          ./scripts/verify_jvm.sh
      - name: Unit tests, lint and unsigned verification builds
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleDebug assembleRelease bundleRelease
      - name: Upload verification outputs
        uses: actions/upload-artifact@v4
        with:
          name: terminal-0.1.0-verify-${{ github.sha }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/lint-results-release.html

  signed-market-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    env:
      TERMINAL_KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
      TERMINAL_KEYSTORE_PASSWORD: ${{ secrets.TERMINAL_KEYSTORE_PASSWORD }}
      TERMINAL_KEY_ALIAS: ${{ secrets.TERMINAL_KEY_ALIAS }}
      TERMINAL_KEY_PASSWORD: ${{ secrets.TERMINAL_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Materialize signing key
        env:
          TERMINAL_KEYSTORE_BASE64: ${{ secrets.TERMINAL_KEYSTORE_BASE64 }}
        run: |
          test -n "$TERMINAL_KEYSTORE_BASE64"
          test -n "$TERMINAL_KEYSTORE_PASSWORD"
          test -n "$TERMINAL_KEY_ALIAS"
          test -n "$TERMINAL_KEY_PASSWORD"
          printf '%s' "$TERMINAL_KEYSTORE_BASE64" | base64 --decode > "$TERMINAL_KEYSTORE_PATH"
          chmod 600 "$TERMINAL_KEYSTORE_PATH"
      - name: Build signed APK and AAB
        run: ./gradlew --no-daemon clean testReleaseUnitTest lintRelease assembleRelease bundleRelease
      - name: Verify signatures
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do apksigner verify --verbose --print-certs "$apk"; done
          for aab in app/build/outputs/bundle/release/*.aab; do jarsigner -verify -strict "$aab"; done
      - name: Hash market artifacts
        run: sha256sum app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab > SHA256SUMS.txt
      - name: Upload signed market artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terminal-0.1.0-market-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/lint-results-release.html
            SHA256SUMS.txt
